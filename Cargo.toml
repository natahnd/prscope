[package]
name = "pr-reviews"
version = "0.1.0"
edition = "2021"
description = "Azure DevOps pull request review TUI"
default-run = "pr-reviews"

[lib]
name = "pr_reviews"
path = "src/lib.rs"

[[bin]]
name = "pr-reviews"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-std", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.12"
unicode-width = "0.2"
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"
open = "5"
dirs = "5"
urlencoding = "2"
async-trait = "0.1"
base64 = "0.22"
similar = "2"

[dev-dependencies]
